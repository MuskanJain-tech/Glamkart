{% extends "Glamkart/base.html" %}
{% block content %}

<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #d0e9e6, #f0f9ff);
    margin: 0;
    min-height: 100vh;
  }

  .checkout-container {
    max-width: 1100px;
    margin: 2rem auto;
    padding: 2rem;
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    backdrop-filter: blur(12px);
    animation: fadeIn 1.2s ease-in-out;
  }

  .checkout-title {
    text-align: center;
    font-size: 2.5rem;
    font-weight: 700;
    margin-bottom: 1rem;
    background: linear-gradient(90deg, #6cb4ee, #95d4f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .checkout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2rem;
    margin-top: 2rem;
  }

  .checkout-form, .order-summary {
    background: rgba(240, 249, 255, 0.9);
    border-radius: 15px;
    padding: 1.5rem;
    box-shadow: 0 6px 20px rgba(0,0,0,0.1);
  }

  .checkout-form h3, .order-summary h3 {
    margin-bottom: 1rem;
    color: #2c3e50;
  }

  .checkout-form label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  .checkout-form input, .checkout-form textarea, .checkout-form select {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 1px solid #ccc;
    border-radius: 10px;
    outline: none;
    font-size: 0.95rem;
    transition: 0.3s;
  }

  .checkout-form input:focus, .checkout-form textarea:focus, .checkout-form select:focus {
    border-color: #6cb4ee;
    box-shadow: 0 0 6px rgba(108,180,238,0.5);
  }

  .place-order-btn {
    width: 100%;
    background: #6cb4ee;
    color: white;
    padding: 0.9rem;
    font-weight: 600;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    font-size: 1rem;
  }

  .place-order-btn:hover {
    background: #4a9fd6;
    transform: scale(1.03);
  }

  /* Order Summary */
  .order-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 1rem;
    font-size: 0.95rem;
  }

  .order-total {
    font-weight: 700;
    font-size: 1.1rem;
    border-top: 1px solid #ccc;
    padding-top: 0.8rem;
    margin-top: 0.8rem;
  }

  @media (max-width: 900px) {
    .checkout-grid {
      grid-template-columns: 1fr;
    }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<div class="checkout-container">
  <h1 class="checkout-title">Checkout 🛒</h1>

  <div class="checkout-grid">
    <!-- Delivery Form -->
    <div class="checkout-form">
      <h3>Delivery Details</h3>
      <form method="POST" action="{% url 'place_order' %}"></form>
        {% csrf_token %}
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" required>

        <label for="address">Delivery Address</label>
        <textarea id="address" name="address" rows="3" required></textarea>

        <label for="city">City</label>
        <input type="text" id="city" name="city" required>

        <label for="state">State</label>
        <input type="text" id="state" name="state" required>

        <label for="zip">ZIP Code</label>
        <input type="text" id="zip" name="zip" required>

        <label for="payment">Payment Method</label>
        <select id="payment" name="payment" required>
          <option value="cod">Cash on Delivery</option>
          <option value="online">Online Payment</option>
        </select>

        <button type="submit" class="place-order-btn">Place Order ✅</button>
      </form>
    </div>

    <!-- Order Summary -->
    <div class="order-summary">
      <h3>Order Summary</h3>
      {% for item in cart_items %}
      <div class="order-item">
        <span>{{ item.product.name }} x {{ item.quantity }}</span>
        <span>₹{{ item.get_total_price }}</span>
      </div>
      {% endfor %}
      <div class="order-total">
        Total: ₹{{ cart_total }}
      </div>
    </div>
  </div>
</div>
<script src='https://cdn.jotfor.ms/agent/embedjs/0199d7235cee76fdba1446a31ead2d467540/embed.js'>
</script>
{% endblock %}
