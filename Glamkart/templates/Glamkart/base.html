{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <style>
    /* Base Styles */
    body {
      font-family: "Poppins", sans-serif;
      padding-top: 90px;
      background: linear-gradient(180deg, #f0f9ff, #e0f7ff, #f7fbff);
      color: #333;
      transition: background 0.4s ease-in-out;
    }

    /* Navbar */
    .pastel-navbar {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 4px 20px rgba(173, 216, 230, 0.25);
      transition: all 0.4s ease-in-out;
      padding: 0.6rem 1.2rem;
    }

    .pastel-navbar:hover {
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 6px 25px rgba(100, 180, 255, 0.35);
    }

    /* Brand Text (GLAMKART) */
    .navbar-brand {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      background: linear-gradient(90deg, #a1c4fd, #0077b6, #a1c4fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-size: 200%;
      animation: shineMove 5s infinite linear;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(173, 216, 230, 0.5);
      transition: transform 0.3s ease, text-shadow 0.3s ease;
    }

    .navbar-brand:hover {
      transform: scale(1.05);
      text-shadow: 0 0 12px rgba(100, 180, 255, 0.8);
    }

    @keyframes shineMove {
      0% { background-position: 0%; }
      100% { background-position: 200%; }
    }

    /* Navbar Links */
    .navbar-nav .nav-link {
      font-weight: 500;
      color: #004080;
      margin: 0 0.6rem;
      transition: all 0.3s ease;
      border-radius: 20px;
      padding: 8px 14px;
    }

    .navbar-nav .nav-link:hover,
    .navbar-nav .nav-link.active {
      background-color: #0077b6;
      color: #fff !important;
      box-shadow: 0 3px 10px rgba(0, 119, 182, 0.4);
      transform: translateY(-2px);
    }

    /* Search bar */
    .form-control {
      border: none;
      padding: 6px 12px;
      border-radius: 25px;
      font-family: "Poppins", sans-serif;
      box-shadow: 0 0 6px rgba(0, 119, 182, 0.15);
      transition: all 0.3s ease;
    }

    .form-control:focus {
      box-shadow: 0 0 6px rgba(0, 119, 182, 0.5);
    }

    /* Buttons */
    .btn-custom {
      background: #ffffff;
      color: #0077b6 !important;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 25px;
      transition: all 0.3s ease-in-out;
    }

    .btn-custom:hover {
      background: #0077b6;
      color: #fff !important;
      box-shadow: 0 4px 15px rgba(0, 119, 182, 0.4);
      transform: translateY(-2px);
    }

    /* Profile Image */
    .profile-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fff;
      transition: all 0.3s ease;
    }

    .profile-img:hover {
      box-shadow: 0 0 10px rgba(173, 216, 230, 0.6);
      transform: scale(1.05);
    }

    /* Dropdown Menu */
    .dropdown-menu {
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      border: none;
    }

    /* Header Section */
    header {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      color: #fff;
      text-align: center;
      height: 150px;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 20px rgba(0, 119, 182, 0.3);
      margin-top: 10px;
    }

    header h1 {
      font-family: "Playfair Display", serif;
      font-size: 2.2rem;
      letter-spacing: 1px;
      animation: fadeIn 1s ease-in;
    }

    header p {
      font-size: 1.1rem;
      margin-top: 5px;
      opacity: 0.9;
    }

    /* Page Animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .container {
      animation: fadeIn 1s ease-out;
    }
  </style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg fixed-top pastel-navbar">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">𝙶𝙻𝙰𝙼𝙺𝙰𝚁𝚃</a>

      <!-- Toggle for mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav text-center">
          <li class="nav-item"><a class="nav-link active" href="{% url 'home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
          
          <li class="nav-item"><a class="nav-link" href="{% url 'contact' %}">Contact</a></li>
        </ul>
      </div>

      <div class="d-flex align-items-center">
        <!-- Search -->
        <form class="d-flex me-3" method="GET" action="{% url 'search' %}">
          <input class="form-control form-control-sm rounded-pill me-2" type="search" name="q" placeholder="Search..." aria-label="Search" />
          <button class="btn btn-light btn-sm rounded-pill" type="submit">🔍</button>
        </form>

        <!-- Profile / Login -->
        <div class="dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="navbarProfile" role="button" data-bs-toggle="dropdown">
            <img
              src="{% if request.user.is_authenticated and request.user.profile.photo %}{{ request.user.profile.photo.url }}{% else %}{% static 'image/login.png' %}{% endif %}"
              alt="Profile"
              class="profile-img"
            />
            {% if request.user.is_authenticated %}
            <span class="ms-2">{{ request.user.username }}</span>
            {% endif %}
          </a>
          <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarProfile">
            {% if request.user.is_authenticated %}
            <li><a class="dropdown-item" href="{% url 'dashboard' %}">Dashboard</a></li>
            <li><a class="dropdown-item" href="{% url 'logout' %}">Logout</a></li>
            {% else %}
            <li><a class="dropdown-item" href="{% url 'login' %}">Login</a></li>
            <li><a class="dropdown-item" href="{% url 'register' %}">Register</a></li>
            {% endif %}
          </ul>
        </div>
      </div>
    </div>
  </nav>


  <!-- Page Content -->
  <div class="container mt-4">
    {% block content %}
    {% endblock %}
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
