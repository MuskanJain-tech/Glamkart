{% extends "Glamkart/base.html" %}
{% block content %}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

  body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #e0f2f1, #f8fdff);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }

  /* Floating particles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(108, 180, 238, 0.18);
    animation: float 12s infinite;
    opacity: 0.5;
    filter: blur(1px);
    z-index: 1;
  }

  @keyframes float {
    0% { transform: translateY(100vh) scale(0.6); opacity: 0.3; }
    50% { opacity: 0.6; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .forgot-container {
    position: relative;
    width: 420px;
    max-width: 95%;
    padding: 2.8rem 2.2rem;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(18px);
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    text-align: center;
    z-index: 10;
    animation: fadeIn 1.2s ease;
  }

  .forgot-container h2 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 1.5rem;
    background: linear-gradient(90deg, #4285f4, #6cb4ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .form-group {
    margin-bottom: 1.5rem;
    text-align: left;
  }

  .form-group label {
    font-size: 0.9rem;
    color: #305a85;
    font-weight: 500;
    display: block;
    margin-bottom: 0.4rem;
  }

  .form-group input {
    width: 100%;
    padding: 0.9rem 1rem;
    border: 1px solid #dce8f7;
    border-radius: 12px;
    background: #f8fbff;
    font-size: 0.95rem;
    outline: none;
    transition: all 0.3s ease;
  }

  .form-group input:focus {
    border-color: #6cb4ee;
    box-shadow: 0 0 10px rgba(108,180,238,0.35);
    transform: scale(1.02);
  }

  .btn-submit {
    width: 100%;
    padding: 1rem;
    border: none;
    border-radius: 40px;
    background: linear-gradient(135deg, #4a9edc, #6cb4ee);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-submit:hover {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 6px 18px rgba(108,180,238,0.35);
  }

  .extra-links {
    margin-top: 1rem;
    font-size: 0.9rem;
  }

  .extra-links a {
    color: #3a6ea5;
    text-decoration: none;
    font-weight: 500;
    margin: 0 5px;
    transition: 0.3s;
  }

  .extra-links a:hover {
    text-decoration: underline;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 500px) {
    .forgot-container {
      width: 90%;
      padding: 2rem 1.5rem;
    }
  }
</style>

<!-- Floating bubbles -->
<div class="bubble" style="width: 50px; height:50px; left:10%; animation-duration:13s;"></div>
<div class="bubble" style="width: 80px; height:80px; left:70%; animation-duration:18s;"></div>
<div class="bubble" style="width: 35px; height:35px; left:50%; animation-duration:10s;"></div>
<div class="bubble" style="width: 65px; height:65px; left:30%; animation-duration:15s;"></div>

<div class="forgot-container">
  <h2>Forgot Password?</h2>
  <p>Enter your email address below and we'll send you a link to reset your password.</p>

  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
    </div>

    <button type="submit" class="btn-submit">Send Reset Link</button>
  </form>

  <div class="extra-links">
    <a href="{% url 'login' %}">Back to Login</a>
  </div>
</div>

{% endblock %}
