{% extends "base.html" %}
{% block content %}

<style>
  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #d0e9e6, #f0f9ff);
    min-height: 100vh;
  }

  .faq-container {
    max-width: 900px;
    margin: 3rem auto;
    padding: 2.5rem;
    background: rgba(255, 255, 255, 0.95);
    border-radius: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    backdrop-filter: blur(12px);
    animation: fadeIn 1.2s ease-in-out;
  }

  .faq-title {
    text-align: center;
    font-size: 2.8rem;
    font-weight: 800;
    margin-bottom: 0.5rem;
    background: linear-gradient(90deg, #6cb4ee, #95d4f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .faq-subtitle {
    text-align: center;
    font-size: 1.2rem;
    color: #555;
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  .faq-item {
    background: rgba(240, 249, 255, 0.95);
    border-radius: 15px;
    margin-bottom: 1rem;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
    transition: transform 0.3s, box-shadow 0.3s;
  }

  .faq-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  .faq-question {
    padding: 1.2rem 1.5rem;
    cursor: pointer;
    font-weight: 600;
    font-size: 1.1rem;
    color: #2c3e50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: color 0.3s;
  }

  .faq-question:hover {
    color: #6cb4ee;
  }

  .faq-question::after {
    content: '+';
    font-weight: 700;
    font-size: 1.4rem;
    transition: transform 0.3s;
    color: #6cb4ee;
  }

  .faq-item.active .faq-question::after {
    content: '-';
    transform: rotate(180deg);
  }

  .faq-answer {
    padding: 0 1.5rem 1rem 1.5rem;
    max-height: 0;
    overflow: hidden;
    font-size: 0.95rem;
    color: #555;
    line-height: 1.6;
    transition: max-height 0.5s ease, padding 0.3s ease;
  }

  .faq-item.active .faq-answer {
    max-height: 500px; /* Enough to show full content */
    padding-top: 0.8rem;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 768px) {
    .faq-container { padding: 2rem 1.5rem; }
    .faq-title { font-size: 2.2rem; }
  }
</style>

<div class="faq-container">
  <h1 class="faq-title">Frequently Asked Questions ❓</h1>
  <p class="faq-subtitle">Here are some common questions and answers about MYSHOP and your shopping experience.</p>

  {% for faq in faqs %}
  <div class="faq-item">
    <div class="faq-question">{{ faq.question }}</div>
    <div class="faq-answer">{{ faq.answer }}</div>
  </div>
  {% empty %}
    <p style="text-align:center; padding:1.5rem;">No FAQs available at the moment.</p>
  {% endfor %}
</div>

<script>
  const faqItems = document.querySelectorAll('.faq-item');

  faqItems.forEach(item => {
    const question = item.querySelector('.faq-question');
    question.addEventListener('click', () => {
      // Toggle current item
      item.classList.toggle('active');
      // Collapse other items
      faqItems.forEach(otherItem => {
        if (otherItem !== item) {
          otherItem.classList.remove('active');
        }
      });
    });
  });
</script>

{% endblock %}
