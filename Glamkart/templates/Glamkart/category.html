<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment | GlamKart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #fce4ec, #fff);
            font-family: Arial, sans-serif;
        }
        .payment-box {
            max-width: 650px;
            margin: 80px auto;
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }
        .payment-box h2 {
            color: #ff4081;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-check-label {
            font-size: 1.1rem;
            color: #444;
        }
        .btn-pay {
            margin-top: 25px;
            background-color: #ff4081;
            color: white;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 1rem;
            display: block;
            width: 100%;
        }
        .btn-pay:hover {
            background-color: #e91e63;
        }
        .summary-box {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }
        .summary-box h5 {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="payment-box">
        <h2>Choose Payment Method</h2>

        <!-- Order Summary -->
        <div class="summary-box">
            <h5>Order Summary</h5>
            <p><b>Total Items:</b> {{ order.items.count }}</p>
            <p><b>Total Price:</b> ₹{{ order.total_price }}</p>
        </div>

        <!-- Payment Options -->
        <form method="POST" action="{% url 'payment_success' %}">
            {% csrf_token %}

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="payment_method" id="cod" value="cod" checked>
                <label class="form-check-label" for="cod">
                    Cash on Delivery (COD)
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="payment_method" id="upi" value="upi">
                <label class="form-check-label" for="upi">
                    UPI (Google Pay, PhonePe, Paytm)
                </label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="payment_method" id="card" value="card">
                <label class="form-check-label" for="card">
                    Credit / Debit Card
                </label>
            </div>

            <button type="submit" class="btn btn-pay">Proceed to Pay</button>
        </form>
    </div>
</body>
<script src='https://cdn.jotfor.ms/agent/embedjs/0199d7235cee76fdba1446a31ead2d467540/embed.js'>
</script>
</html>
